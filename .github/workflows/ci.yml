# The deterministic gate: the same command contract agents verify with locally,
# enforced on every PR by machinery that cannot be talked past. Agent review
# layers on top of this; it never substitutes for it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Wired by /setup-stack, one step per command-contract entry. Pin any new
      # action to a full commit SHA; the security scan blocks mutable tags. E.g.:
      # - uses: pnpm/action-setup@<commit-sha> # v4
      # - run: pnpm install --frozen-lockfile
      # - run: <check command>
      # - run: <test command>
      # - run: <build command>
      - name: Contract not wired yet
        run: echo "Run /setup-stack to wire the command contract into this job."

  # Behavior, not just compilation: start the app and drive its critical user
  # journeys. This is where the full suite runs; agents in the loop exercise the
  # surface their diff touches. Wired by /setup-stack.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # One step per contract entry needed to run the app, then the smoke
      # command itself. Pin any new action to a full commit SHA. E.g.:
      # - uses: pnpm/action-setup@<commit-sha> # v4
      # - run: pnpm install --frozen-lockfile
      # - run: <run command> &
      # - run: <smoke command>
      - name: Smoke not wired yet
        run: echo "Run /setup-stack to wire the smoke command into this job."

  # Conventional commits, enforced (CLAUDE.md states the rule; this checks it).
  # Applies to agents and humans alike. commitlint versions come from the
  # repo's own package.json (Dependabot keeps them current); the pnpm version
  # comes from its packageManager field.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - run: pnpm install --frozen-lockfile
      - name: commitlint
        run: >
          pnpm commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # Lint the workflows themselves; until a stack exists they are most of the
  # code in this repo, and agents edit them.
  workflows-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  # Unit tests are a floor, not a verdict: a large share of functionally-correct
  # AI-generated code still introduces security vulnerabilities. Scan independently.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config auto --error
