# Outer loop, autonomous: on a schedule, the PM agent triages the backlog and
# dispatches ready issues that can run independently in parallel, one spec at
# a time (labeling an issue `agent` triggers agent-task.yml). Humans still
# hold the merge gate, which is also what paces dispatch.
#
# Disabled by default: uncomment the `schedule` block to enable. Requires the
# same setup as agent-task.yml.
name: PM triage

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '0 8 * * 1-5' # weekday mornings UTC

permissions:
  contents: read
  issues: write

jobs:
  pm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: anthropics/claude-code-action@af0559ee4f514d1ef21826982bed13f7edc3c35e # v1
        with:
          # Set one of these secrets; the subscription token is preferred.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run the /pm skill with --dispatch.
          claude_args: '--max-turns 100'
